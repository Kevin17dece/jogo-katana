<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Shadow Combat</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }

canvas { display:block; }

#ui {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:15px;
}

button {
  width:110px;
  height:55px;
  border:none;
  border-radius:14px;
  background:#ffffff1a;
  color:white;
  font-size:16px;
  backdrop-filter: blur(10px);
}

#hp {
  position:absolute;
  top:15px;
  width:100%;
  display:flex;
  justify-content:space-around;
  color:white;
  font-size:14px;
}

.bar {
  width:120px;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:100%;
  background:red;
}
</style>
</head>

<body>

<div id="hp">
  <div>Player HP <div class="bar"><div id="php" class="fill"></div></div></div>
  <div>Enemy HP <div class="bar"><div id="ehp" class="fill"></div></div></div>
</div>

<div id="ui">
  <button onclick="attack()">ATTACK</button>
  <button onclick="defend()">DEFEND</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let player, enemy;
let playerHP = 100;
let enemyHP = 100;

let defending = false;
let enemyCooldown = 0;
let combo = 0;
let lastAttack = 0;

init();
animate();

function createFighter(color, x){
  let group = new THREE.Group();

  let body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.5, 1.2, 4, 8),
    new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity:0.2 })
  );

  let head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xffccaa })
  );
  head.position.y = 1.3;

  group.add(body);
  group.add(head);

  group.position.set(x,1,0);

  return group;
}

function init(){
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,2.5,6);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(5,10,5);
  scene.add(light);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshStandardMaterial({color:0x111111})
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  player = createFighter(0x00ffff, -1);
  enemy = createFighter(0xff3355, 2);

  scene.add(player);
  scene.add(enemy);
}

function attack(){
  let now = Date.now();

  if(now - lastAttack < 400) combo++;
  else combo = 1;

  lastAttack = now;

  // dash forward
  player.position.x += 0.4;

  setTimeout(()=>{
    player.position.x -= 0.4;
  },120);

  let dist = player.position.distanceTo(enemy.position);

  if(dist < 2){
    let dmg = 10 + combo * 3;

    if(defending){
      enemyHP -= dmg * 0.2;
      enemy.material.children?.forEach?.(()=>{}); // safe ignore
      enemy.scale.set(0.95,0.95,0.95);
      setTimeout(()=>enemy.scale.set(1,1,1),100);
    } else {
      enemyHP -= dmg;
      enemy.position.x += 0.3;
      enemy.scale.set(0.9,0.9,0.9);
      setTimeout(()=>enemy.scale.set(1,1,1),120);
    }

    updateHP();
  }
}

function defend(){
  defending = true;
  player.scale.set(1.05,1.05,1.05);

  setTimeout(()=>{
    defending = false;
    player.scale.set(1,1,1);
  },500);
}

function enemyAI(){
  if(enemyCooldown > 0){
    enemyCooldown--;
    return;
  }

  let dist = enemy.position.distanceTo(player.position);

  if(dist > 1.8){
    enemy.position.x -= 0.02;
  } else {
    // attack player
    enemyCooldown = 80;

    let dmg = 8;

    if(defending){
      playerHP -= dmg * 0.3;
    } else {
      playerHP -= dmg;
      player.position.x -= 0.25;
    }

    player.scale.set(0.9,0.9,0.9);
    setTimeout(()=>player.scale.set(1,1,1),120);

    updateHP();
  }
}

function updateHP(){
  document.getElementById("php").style.width = playerHP + "%";
  document.getElementById("ehp").style.width = enemyHP + "%";

  if(playerHP <= 0) alert("YOU LOSE");
  if(enemyHP <= 0) alert("YOU WIN");
}

function animate(){
  requestAnimationFrame(animate);

  enemyAI();

  camera.position.x += (player.position.x - camera.position.x) * 0.05;
  camera.lookAt(player.position.x,1,0);

  renderer.render(scene,camera);
}
</script>

</body>
</html>
