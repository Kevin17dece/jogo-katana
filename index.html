<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadow Combat Prototype</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-family: Arial;
  }
</style>
</head>
<body>
<div id="ui">Clique para atacar (Combo: clique rápido)</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let player, enemy;
let lastClick = 0;
let combo = 0;

init();
animate();

function init(){
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 6);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // luz
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,10,5);
  scene.add(light);

  // chão
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // player
  player = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({ color: 0x00ffcc })
  );
  player.position.set(-1,1,0);
  scene.add(player);

  // enemy
  enemy = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({ color: 0xff0044 })
  );
  enemy.position.set(2,1,0);
  scene.add(enemy);

  window.addEventListener("click", attack);
}

function attack(){
  const now = Date.now();

  if(now - lastClick < 400){
    combo++;
  } else {
    combo = 1;
  }

  lastClick = now;

  // animação simples de ataque
  player.position.x += 0.3;

  setTimeout(() => {
    player.position.x -= 0.3;
  }, 120);

  checkHit();
}

function checkHit(){
  const distance = player.position.distanceTo(enemy.position);

  if(distance < 2){
    enemy.material.color.set(0xffff00);

    setTimeout(() => {
      enemy.material.color.set(0xff0044);
    }, 200);
  }
}

function animate(){
  requestAnimationFrame(animate);

  // câmera leve cinematográfica
  camera.position.x += (player.position.x - camera.position.x) * 0.05;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}
</script>
</body>
</html>
