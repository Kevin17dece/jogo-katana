<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shadow Fight Style Full Base</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }

#ui {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button {
  width:90px;
  height:50px;
  background:#00000080;
  color:white;
  border:1px solid white;
}
</style>
</head>
<body>

<div id="ui">
  <button onclick="atk()">ATTACK</button>
  <button onclick="kick()">KICK</button>
  <button onclick="block()">BLOCK</button>
  <button onclick="dodge()">DODGE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ================= SCENE =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 20, 120);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,15,30);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const light = new THREE.PointLight(0xffaa55, 2, 200);
light.position.set(0,20,10);
scene.add(light);
scene.add(new THREE.AmbientLight(0x111111));

// ================= CAVE =================
const mat = new THREE.MeshStandardMaterial({color:0x222222, roughness:1});

const floor = new THREE.Mesh(new THREE.PlaneGeometry(200,200), mat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

function wall(x,z,rot){
  const w = new THREE.Mesh(new THREE.PlaneGeometry(200,80), mat);
  w.position.set(x,40,z);
  w.rotation.y = rot;
  scene.add(w);
}

wall(0,-50,0);
wall(50,0,Math.PI/2);
wall(-50,0,Math.PI/2);

// ================= FIGHTERS =================
function Fighter(x,color){
  const g = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2,5,1),
    new THREE.MeshBasicMaterial({color})
  );

  g.add(body);
  g.position.x = x;
  g.position.y = 3;

  scene.add(g);

  return g;
}

const player = Fighter(-5,0x000000);
const enemy = Fighter(5,0x000000);

// ================= STATE =================
let combo = 0;
let canAttack = true;
let blocking = false;
let dodgeState = false;

// ================= COMBAT =================
function atk(){
  if(!canAttack) return;

  canAttack = false;
  combo++;

  if(combo > 3) combo = 1;

  attackHit(combo);

  setTimeout(()=> canAttack = true, 400);
}

function kick(){
  attackHit(2);
}

function block(){
  blocking = true;
  setTimeout(()=> blocking=false, 400);
}

function dodge(){
  dodgeState = true;
  player.position.x += 3;
  setTimeout(()=> dodgeState=false, 200);
}

// ================= HIT SYSTEM =================
function attackHit(type){

  let dist = Math.abs(player.position.x - enemy.position.x);

  if(dist < 6){

    let dmg = type === 1 ? 5 : type === 2 ? 10 : 15;

    if(enemy.blocking){
      dmg *= 0.3;
    }

    enemy.health = (enemy.health || 100) - dmg;

    enemy.position.x += 2;

    shake();
  }
}

// ================= IA =================
function enemyAI(){

  let dist = Math.abs(player.position.x - enemy.position.x);

  if(dist > 6){
    enemy.position.x -= 0.05;
  } else {
    if(Math.random() < 0.02){
      enemyAttack();
    }
  }
}

function enemyAttack(){

  let dist = Math.abs(player.position.x - enemy.position.x);

  if(dist < 6){

    if(blocking){
      // parry
      enemy.position.x += 2;
    } else {
      player.position.x -= 2;
      shake();
    }
  }
}

// ================= CAMERA SHAKE =================
let shakePower = 0;

function shake(){
  shakePower = 0.5;
}

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);

  enemyAI();

  camera.position.x = player.position.x;
  camera.lookAt(player.position.x,2,0);

  if(shakePower > 0){
    camera.position.y += (Math.random()-0.5)*shakePower;
    camera.position.x += (Math.random()-0.5)*shakePower;
    shakePower *= 0.9;
  }

  renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
