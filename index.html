<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Fight AAA Core</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#ui {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
}

button {
  width:110px;
  height:55px;
  border:none;
  border-radius:14px;
  background:#ffffff1a;
  color:white;
  font-size:16px;
}

#hp {
  position:absolute;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
  color:white;
  font-family:Arial;
}

.bar {
  width:140px;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:100%;
  background:red;
}
</style>
</head>

<body>

<div id="hp">
  <div>Player <div class="bar"><div id="php" class="fill"></div></div></div>
  <div>Enemy <div class="bar"><div id="ehp" class="fill"></div></div></div>
</div>

<div id="ui">
  <button onclick="attack()">ATTACK</button>
  <button onclick="defend()">DEFEND</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let player, enemy;
let playerHP = 100;
let enemyHP = 100;

let defending = false;
let enemyTimer = 0;
let shake = 0;

init();
animate();

function createHuman(color, x){
  let g = new THREE.Group();

  let material = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 0.15
  });

  let body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.2,4,8), material);
  let head = new THREE.Mesh(new THREE.SphereGeometry(0.28,12,12),
    new THREE.MeshStandardMaterial({color:0xffccaa}));

  head.position.y = 1.3;

  let armL = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.8,0.2), material);
  let armR = armL.clone();

  armL.position.set(-0.6,0.3,0);
  armR.position.set(0.6,0.3,0);

  g.add(body);
  g.add(head);
  g.add(armL);
  g.add(armR);

  g.position.set(x,1,0);

  return g;
}

function init(){
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,2.5,6);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1.3);
  light.position.set(5,10,5);
  scene.add(light);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({color:0x111111})
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  player = createHuman(0x00ffff, -1);
  enemy = createHuman(0xff3355, 2);

  scene.add(player);
  scene.add(enemy);
}

function attack(){
  player.position.x += 0.35;

  // animação simples de punch
  player.children[2].rotation.z = -0.8;
  player.children[3].rotation.z = 0.8;

  setTimeout(()=>{
    player.position.x -= 0.35;
    player.children[2].rotation.z = 0;
    player.children[3].rotation.z = 0;
  },120);

  let dist = player.position.distanceTo(enemy.position);

  if(dist < 2){
    let dmg = 10;

    if(defending){
      enemyHP -= dmg * 0.3;
    } else {
      enemyHP -= dmg;
      enemy.position.x += 0.25;
      shake = 8;
    }

    updateHP();
  }
}

function defend(){
  defending = true;
  player.scale.set(1.05,1.05,1.05);

  setTimeout(()=>{
    defending = false;
    player.scale.set(1,1,1);
  },500);
}

function enemyAI(){
  if(enemyTimer > 0){
    enemyTimer--;
    return;
  }

  let dist = enemy.position.distanceTo(player.position);

  if(dist > 1.7){
    enemy.position.x -= 0.02;
  } else {
    enemyTimer = 70;

    let dmg = 8;

    if(defending){
      playerHP -= dmg * 0.3;
    } else {
      playerHP -= dmg;
      player.position.x -= 0.3;
      shake = 6;
    }

    updateHP();
  }
}

function updateHP(){
  document.getElementById("php").style.width = playerHP + "%";
  document.getElementById("ehp").style.width = enemyHP + "%";

  if(playerHP <= 0) alert("YOU LOSE");
  if(enemyHP <= 0) alert("YOU WIN");
}

function animate(){
  requestAnimationFrame(animate);

  enemyAI();

  // câmera cinematográfica + shake
  let targetX = player.position.x;
  camera.position.x += (targetX - camera.position.x) * 0.06;

  if(shake > 0){
    camera.position.y += Math.random()*0.1;
    shake--;
  }

  camera.lookAt(player.position.x,1,0);

  renderer.render(scene,camera);
}
</script>

</body>
</html>
