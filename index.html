<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>AAA Shadow Fight Anim Base</title>

<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 5, 60);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// luz
scene.add(new THREE.AmbientLight(0x333333));
const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(5,10,5);
scene.add(light);

// chão
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({ color:0x111111 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// =========================
// INPUT
// =========================
const keys = {};
document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// =========================
// LOADER
// =========================
const loader = new THREE.GLTFLoader();

let player, enemy;
let playerMixer, enemyMixer;

function loadFighter(url, x, colorShift=0x000000){

 loader.load(url,(gltf)=>{

  const model = gltf.scene;
  model.scale.set(1,1,1);
  model.position.set(x,0,0);

  scene.add(model);

  const mixer = new THREE.AnimationMixer(model);

  let idle = gltf.animations[0]; // primeira animação (idle geralmente)

  let action = mixer.clipAction(idle);
  action.play();

  if(x===0){
   player = model;
   playerMixer = mixer;
  } else {
   enemy = model;
   enemyMixer = mixer;
  }

 });
}

// modelo humano simples (padrão online)
loadFighter("https://threejs.org/examples/models/gltf/Soldier.glb", 0);
loadFighter("https://threejs.org/examples/models/gltf/Soldier.glb", 2);

// =========================
// COMBATE AAA CORE
// =========================
function hitCheck(){

 if(!player || !enemy) return;

 let dist = player.position.distanceTo(enemy.position);

 if(dist < 1.5){
  enemy.position.x += 0.2; // knockback simples
 }
}

document.addEventListener("click",()=>{
 hitCheck();
});

// =========================
// LOOP
// =========================
function animate(){
 requestAnimationFrame(animate);

 let speed = 0.05;

 if(player){
  if(keys["w"]) player.position.z -= speed;
  if(keys["s"]) player.position.z += speed;
  if(keys["a"]) player.position.x -= speed;
  if(keys["d"]) player.position.x += speed;
 }

 if(playerMixer) playerMixer.update(0.016);
 if(enemyMixer) enemyMixer.update(0.016);

 // IA simples
 if(player && enemy){
  enemy.position.x += (player.position.x - enemy.position.x) * 0.01;
 }

 // câmera luta
 if(player){
  camera.position.set(
   player.position.x,
   player.position.y + 2,
   player.position.z + 5
  );
  camera.lookAt(player.position);
 }

 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
