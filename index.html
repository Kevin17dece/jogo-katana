<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Mobile Fight</title>

<style>
body { margin:0; overflow:hidden; background:black; }

canvas { display:block; }

#ui {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

button {
  width:120px;
  height:60px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#ffffff20;
  color:white;
  backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="attack()">ATACAR</button>
  <button onclick="defend()">DEFENDER</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let player, enemy;
let defending = false;

init();
animate();

function init(){
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,2,6);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // luz
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,10,5);
  scene.add(light);

  // chão
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshStandardMaterial({color:0x222222})
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // player
  player = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({color:0x00ffcc})
  );
  player.position.set(-1,1,0);
  scene.add(player);

  // enemy
  enemy = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({color:0xff0044})
  );
  enemy.position.set(2,1,0);
  scene.add(enemy);
}

function attack(){
  player.position.x += 0.4;

  setTimeout(()=>{
    player.position.x -= 0.4;
  },120);

  let dist = player.position.distanceTo(enemy.position);

  if(dist < 2){
    if(defending){
      enemy.material.color.set(0x00ff00); // bloqueou
    } else {
      enemy.material.color.set(0xffff00); // hit

      enemy.position.x += 0.3; // knockback

      setTimeout(()=>{
        enemy.material.color.set(0xff0044);
      },200);
    }
  }
}

function defend(){
  defending = true;

  player.material.color.set(0x4444ff);

  setTimeout(()=>{
    defending = false;
    player.material.color.set(0x00ffcc);
  },500);
}

function animate(){
  requestAnimationFrame(animate);

  camera.position.x += (player.position.x - camera.position.x)*0.05;
  camera.lookAt(player.position);

  renderer.render(scene,camera);
}
</script>

</body>
</html>
