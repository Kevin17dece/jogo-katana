<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>AAA 3D World Base</title>

<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
// ============================
// SETUP BÁSICO 3D
// ============================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87ceeb, 20, 120);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ============================
// LUZ
// ============================
const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(10,20,10);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

// ============================
// MUNDO ABERTO (TERRENO)
// ============================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x228B22 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ============================
// PLAYER (PLACEHOLDER 3D)
// ============================
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,1),
  new THREE.MeshStandardMaterial({ color: 0x00aaff })
);
player.position.y = 1;
scene.add(player);

// ============================
// ENEMY
// ============================
const enemy = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,1),
  new THREE.MeshStandardMaterial({ color: 0xff3333 })
);
enemy.position.set(5,1,5);
scene.add(enemy);

// ============================
// CONTROLES
// ============================
const keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// ============================
// CÂMERA 360 (DRAG)
// ============================
let isDragging = false;
let rotY = 0;
let rotX = 0;

document.addEventListener("mousedown", ()=>isDragging=true);
document.addEventListener("mouseup", ()=>isDragging=false);

document.addEventListener("mousemove", (e)=>{
 if(isDragging){
  rotY -= e.movementX * 0.005;
  rotX -= e.movementY * 0.005;
  rotX = Math.max(-1.2, Math.min(1.2, rotX));
 }
});

// mobile touch
let lastX=0, lastY=0;

document.addEventListener("touchmove",(e)=>{
 let t = e.touches[0];
 if(lastX){
  rotY -= (t.clientX - lastX)*0.005;
  rotX -= (t.clientY - lastY)*0.005;
  rotX = Math.max(-1.2, Math.min(1.2, rotX));
 }
 lastX = t.clientX;
 lastY = t.clientY;
});

// ============================
// LOOP
// ============================
function animate(){
 requestAnimationFrame(animate);

 // movimento relativo à câmera
 let speed = 0.15;

 let forward = new THREE.Vector3(
  Math.sin(rotY),
  0,
  Math.cos(rotY)
 );

 let right = new THREE.Vector3(
  Math.cos(rotY),
  0,
  -Math.sin(rotY)
 );

 if(keys["w"]) player.position.addScaledVector(forward, speed);
 if(keys["s"]) player.position.addScaledVector(forward, -speed);
 if(keys["a"]) player.position.addScaledVector(right, -speed);
 if(keys["d"]) player.position.addScaledVector(right, speed);

 // câmera 3ª pessoa livre
 let camOffset = new THREE.Vector3(
  Math.sin(rotY)*5,
  3 + rotX*2,
  Math.cos(rotY)*5
 );

 camera.position.copy(player.position).add(camOffset);
 camera.lookAt(player.position);

 // inimigo simples
 enemy.position.x += Math.sin(Date.now()*0.001)*0.01;

 renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
 camera.aspect = window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
