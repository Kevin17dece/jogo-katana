<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sword Duel INSANE 2.0</title>

<style>
body {
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
    overflow:hidden;
}

canvas {
    width:100%;
    height:55vh;
    background:linear-gradient(#020202,#111);
}

.bar {
    width:90%;
    height:12px;
    background:#222;
    margin:5px auto;
    border-radius:6px;
    overflow:hidden;
}

.fill { height:100%; }

#player { background:#00ffcc; }
#enemy { background:#ff4444; }

#status { margin:10px; font-size:18px; }
#score { font-size:16px; }

button {
    width:80%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#00ffaa;
    margin-top:8px;
}
</style>
</head>

<body>

<div id="menu">
    <h2>⚔️ INSANE 2.0</h2>
    <button onclick="startGame()">▶️ START</button>
</div>

<div id="game" style="display:none;">
<div id="status">Prepare-se...</div>
<div id="score">Score: 0</div>

<div class="bar"><div id="enemy" class="fill"></div></div>
<div class="bar"><div id="player" class="fill"></div></div>

<canvas id="c"></canvas>

<button onclick="attack()">⚔️ ATACAR</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=window.innerWidth;
c.height=300;

let state="wait";
let stamina=100;
let enemy=100;
let timer=0;
let difficulty=700;
let combo=0;
let score=0;
let phase=1;
let particles=[];
let trails=[];

const status=document.getElementById("status");
const pbar=document.getElementById("player");
const ebar=document.getElementById("enemy");
const scoreUI=document.getElementById("score");

function sound(f){
 let a=new AudioContext();
 let o=a.createOscillator();
 o.frequency.value=f;
 o.connect(a.destination);
 o.start();
 setTimeout(()=>o.stop(),100);
}

function spawn(x,y){
 for(let i=0;i<20;i++){
  particles.push({
   x,y,
   vx:(Math.random()-0.5)6,
   vy:(Math.random()-0.5)6,
   life:30
  });
 }
}

function trail(x,y){
 trails.push({x,y,life:10});
}

function drawParticles(){
 particles.forEach(p=>{
  ctx.fillStyle="red";
  ctx.fillRect(p.x,p.y,3,3);
  p.x+=p.vx;
  p.y+=p.vy;
  p.life--;
 });
 particles=particles.filter(p=>p.life>0);
}

function drawTrail(){
 trails.forEach(t=>{
  ctx.fillStyle="rgba(0,255,200,0.3)";
  ctx.fillRect(t.x,t.y,5,5);
  t.life--;
 });
 trails=trails.filter(t=>t.life>0);
}

function draw(){
 ctx.fillStyle="#050505";
 ctx.fillRect(0,0,c.width,c.height);

 // background animado
 ctx.fillStyle="rgba(0,255,200,0.05)";
 ctx.fillRect(Math.sin(Date.now()/500)50+200,0,200,300);

 // player
 ctx.fillStyle="#00aaff";
 ctx.fillRect(80,150,40,80);

 // enemy
 ctx.fillStyle="#ff4444";
 ctx.fillRect(c.width-120,150,40,80);

 drawParticles();
 drawTrail();

 if(state==="attack"){
  ctx.fillStyle="yellow";
  ctx.beginPath();
  ctx.arc(c.width-100,150,20+Math.sin(Date.now()/40)10,0,Math.PI2);
  ctx.fill();
 }
}

function update(){
 draw();

 if(state==="wait" && Math.random()<0.02+phase0.005){
  state="attack";
  timer=Date.now();
  status.innerText="⚠️ ATAQUE!";
 }

 if(state==="attack"){
  if(Date.now()-timer>difficulty){
   stamina-=20;
   combo=0;
   pbar.style.width=stamina+"%";
   status.innerText="💥 HIT!";
   sound(100);
   state="wait";

   if(stamina<=0){
    status.innerText="💀 GAME OVER";
    state="end";
   }
  }
 }

 requestAnimationFrame(update);
}

function attack(){
 if(state==="end") return;

 if(state==="attack"){
  let r=Date.now()-timer;

  combo++;
  let dmg=15+combo4;
  enemy-=dmg;
  ebar.style.width=enemy+"%";

  spawn(c.width-100,150);
  trail(c.width-100,150);

  sound(400+combo50);

  if(r<130){
   status.innerText="⚡ PERFECT "+r+"ms x"+combo;
  }else{
   status.innerText="✔️ HIT "+r+"ms x"+combo;
  }

  score+=dmgcombo;
  scoreUI.innerText="Score: "+score;

  difficulty-=20;

  if(enemy<=0){
   phase++;
   enemy=100;
   difficulty=700-phase100;
   status.innerText="👹 FASE "+phase;
  }

  state="wait";

 }else{
  stamina-=10;
  combo=0;
  pbar.style.width=stamina+"%";
  status.innerText="❌ ERROU!";
  sound(80);

  if(stamina<=0){
   status.innerText="💀 GAME OVER";
   state="end";
  }
 }
}

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
}

update();
</script>

</body>
</
