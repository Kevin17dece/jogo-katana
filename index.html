<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fight Style Core Game</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background: radial-gradient(#222,#000);
  font-family: Arial;
}

canvas { display:block; }

#ui {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
}

button {
  width:110px;
  height:55px;
  border:none;
  border-radius:12px;
  background:#ffffff15;
  color:white;
  font-size:14px;
}

#hp {
  position:absolute;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
  color:white;
  font-size:14px;
}

.bar {
  width:140px;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:100%;
  background:red;
}
</style>
</head>

<body>

<div id="hp">
  <div>YOU <div class="bar"><div id="php" class="fill"></div></div></div>
  <div>ENEMY <div class="bar"><div id="ehp" class="fill"></div></div></div>
</div>

<div id="ui">
  <button onclick="attack()">ATTACK</button>
  <button onclick="kick()">KICK</button>
  <button onclick="block()">BLOCK</button>
</div>

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let player = {
  x: 200,
  y: 450,
  hp: 100,
  state: "idle",
  atkFrame: 0,
  weapon: false
};

let enemy = {
  x: 600,
  y: 450,
  hp: 100,
  state: "idle",
  atkFrame: 0,
  cooldown: 0
};

let blocking = false;
let shake = 0;
let combo = 0;
let lastHit = 0;

function drawShadow(x,y,scale=1){
  ctx.fillStyle="black";

  // sombra chão
  ctx.beginPath();
  ctx.ellipse(x,y+80,40*scale,10*scale,0,0,Math.PI*2);
  ctx.fill();

  // corpo
  ctx.fillRect(x-15,y-80,30,90);

  // cabeça
  ctx.fillRect(x-10,y-130,20,50);

  // braços
  ctx.fillRect(x-35,y-60,20,60);
  ctx.fillRect(x+15,y-60,20,60);

  // pernas
  ctx.fillRect(x-25,y+10,20,70);
  ctx.fillRect(x+5,y+10,20,70);
}

function distance(){
  return Math.abs(player.x - enemy.x);
}

function attack(){
  let now = Date.now();

  if(now - lastHit < 400) combo++;
  else combo = 1;

  lastHit = now;

  player.state = "attack";
  player.atkFrame = 10;

  if(distance() < 220){
    let dmg = 8 + combo * 2;

    if(enemy.state === "block"){
      enemy.hp -= dmg * 0.3;
    } else {
      enemy.hp -= dmg;
      enemy.x += 25;
      shake = 8;
    }

    updateHP();
  }
}

function kick(){
  player.state = "kick";
  player.atkFrame = 12;

  if(distance() < 240){
    enemy.hp -= 12;
    enemy.x += 40;
    shake = 10;
    updateHP();
  }
}

function block(){
  blocking = true;
  player.state = "block";

  setTimeout(()=>{
    blocking = false;
    player.state = "idle";
  },500);
}

function enemyAI(){
  if(enemy.cooldown > 0){
    enemy.cooldown--;
    return;
  }

  let dist = distance();

  if(dist > 180){
    enemy.x -= 1.8;
    enemy.state = "walk";
  } else {
    enemy.state = "attack";

    if(Math.random() < 0.03){
      enemy.cooldown = 60;

      if(blocking){
        player.hp -= 2;
      } else {
        player.hp -= 10;
        player.x -= 30;
        shake = 6;
      }

      updateHP();
    }
  }
}

function updateHP(){
  document.getElementById("php").style.width = player.hp + "%";
  document.getElementById("ehp").style.width = enemy.hp + "%";

  if(player.hp <= 0) alert("YOU LOSE");
  if(enemy.hp <= 0) alert("YOU WIN");
}

function updateAnimations(){
  if(player.atkFrame > 0){
    player.atkFrame--;
  }

  if(player.state === "attack"){
    player.x += 2;
    if(player.atkFrame === 0) player.state = "idle";
  }

  if(player.state === "kick"){
    player.x += 3;
    if(player.atkFrame === 0) player.state = "idle";
  }

  if(enemy.state === "attack"){
    enemy.x -= 0.5;
  }
}

function loop(){
  requestAnimationFrame(loop);

  ctx.clearRect(0,0,c.width,c.height);

  if(shake > 0){
    ctx.save();
    ctx.translate(Math.random()*6, Math.random()*6);
    shake--;
  }

  enemyAI();
  updateAnimations();

  drawShadow(player.x,player.y,1);
  drawShadow(enemy.x,enemy.y,1);

  if(shake > 0) ctx.restore();
}

loop();
</script>

</body>
</html>
