<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sword Duel Real</title>

<style>
body {
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
}

canvas {
    width:100%;
    height:60vh;
}

.bar {
    width:90%;
    height:12px;
    background:#222;
    margin:5px auto;
    border-radius:6px;
    overflow:hidden;
}

.fill { height:100%; }

#player { background:#00ffcc; }
#enemy { background:#ff4444; }

#status { margin:10px; font-size:18px; }

button {
    width:80%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#00ffaa;
    margin-top:8px;
}
</style>
</head>

<body>

<div id="menu">
    <h2>⚔️ Sword Duel Real</h2>
    <button onclick="startGame()">▶️ START</button>
</div>

<div id="game" style="display:none;">
<div id="status">Prepare-se...</div>

<div class="bar"><div id="enemy" class="fill"></div></div>
<div class="bar"><div id="player" class="fill"></div></div>

<canvas id="c"></canvas>

<button onclick="attack()">⚔️ ATACAR</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=window.innerWidth;
c.height=320;

let state="wait";
let stamina=100;
let enemy=100;
let timer=0;
let difficulty=700;
let particles=[];

const status=document.getElementById("status");
const pbar=document.getElementById("player");
const ebar=document.getElementById("enemy");

// 🔊 som simples
function sound(f){
 let a=new AudioContext();
 let o=a.createOscillator();
 o.frequency.value=f;
 o.connect(a.destination);
 o.start();
 setTimeout(()=>o.stop(),80);
}

// 🩸 partículas
function spawn(x,y){
 for(let i=0;i<15;i++){
  particles.push({
   x,y,
   vx:(Math.random()-0.5)*5,
   vy:(Math.random()-0.5)*5,
   life:25
  });
 }
}

// 🎨 desenhar personagem com espada
function drawFighter(x,isEnemy){
 ctx.fillStyle=isEnemy?"#ff4444":"#00aaff";

 // corpo
 ctx.fillRect(x-15,200,30,70);

 // cabeça
 ctx.fillStyle="#ffdbac";
 ctx.fillRect(x-12,170,24,24);

 // espada
 ctx.strokeStyle="#ccc";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(x+10,210);
 ctx.lineTo(x+50,180);
 ctx.stroke();
}

// 🌄 fundo
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,320);
 g.addColorStop(0,"#1a1a2e");
 g.addColorStop(1,"#16213e");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,c.width,320);

 ctx.fillStyle="#0f3460";
 ctx.fillRect(0,250,c.width,70);
}

// partículas
function drawParticles(){
 particles.forEach(p=>{
  ctx.fillStyle="red";
  ctx.fillRect(p.x,p.y,3,3);
  p.x+=p.vx;
  p.y+=p.vy;
  p.life--;
 });
 particles=particles.filter(p=>p.life>0);
}

function draw(){
 drawBackground();

 drawFighter(80,false);
 drawFighter(c.width-100,true);

 drawParticles();

 if(state==="attack"){
  ctx.fillStyle="yellow";
  ctx.beginPath();
  ctx.arc(c.width-100,180,20+Math.sin(Date.now()/40)10,0,Math.PI2);
  ctx.fill();
 }
}

function update(){
 draw();

 if(state==="wait" && Math.random()<0.02){
  state="attack";
  timer=Date.now();
  status.innerText="⚠️ DEFENDA!";
 }

 if(state==="attack"){
  if(Date.now()-timer>difficulty){
   stamina-=20;
   pbar.style.width=stamina+"%";
   status.innerText="💥 VOCÊ FOI ATINGIDO!";
   sound(100);
   state="wait";

   if(stamina<=0){
    status.innerText="💀 DERROTA";
    state="end";
   }
  }
 }

 requestAnimationFrame(update);
}

// ⚔️ ataque (GLOBAL pro iPhone)
window.attack=function(){
 if(state==="end") return;

 if(state==="attack"){
  let r=Date.now()-timer;

  enemy-=20;
  ebar.style.width=enemy+"%";

  spawn(c.width-100,180);
  sound(400);

  if(r<150){
   status.innerText="⚡ PERFECT "+r+"ms";
  }else{
   status.innerText="✔️ HIT "+r+"ms";
  }

  if(enemy<=0){
   status.innerText="🏆 VITÓRIA!";
   state="end";
  }else{
   state="wait";
  }

 }else{
  stamina-=10;
  pbar.style.width=stamina+"%";
  status.innerText="❌ ERROU!";
  sound(80);

  if(stamina<=0){
   status.innerText="💀 EXAUSTO";
   state="end";
  }
 }
}

// ▶️ start corrigido
window.startGame=function(){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
}

// toque na tela inteira
c.addEventListener("touchstart",()=>attack());

update();
</script>

</body>
