<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Shadow Fight 3D Base</title>

<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
// =======================
// SETUP
// =======================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 60);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth/window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// =======================
// LUZ (DRAMÁTICA SHADOW)
// =======================
const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0x222222));

// =======================
// CHÃO
// =======================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({ color:0x111111 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// =======================
// FUNÇÃO SHADOW CHARACTER
// =======================
function createShadowFighter(color=0x000000){
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.5,1.2,4,8),
    new THREE.MeshStandardMaterial({ color:color })
  );

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.4,16,16),
    new THREE.MeshStandardMaterial({ color:color })
  );
  head.position.y = 1.5;

  group.add(body);
  group.add(head);

  group.userData = {
    velocity:0,
    attacking:false,
    attackTimer:0
  };

  return group;
}

// =======================
// PLAYER & ENEMY
// =======================
const player = createShadowFighter(0x000000);
player.position.y = 1;
scene.add(player);

const enemy = createShadowFighter(0x111111);
enemy.position.set(3,1,0);
scene.add(enemy);

// =======================
// CONTROLES
// =======================
const keys = {};
document.addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

// =======================
// CÂMERA 360
// =======================
let rotY=0, rotX=0;
let drag=false;

document.addEventListener("mousedown",()=>drag=true);
document.addEventListener("mouseup",()=>drag=false);

document.addEventListener("mousemove",(e)=>{
 if(drag){
  rotY -= e.movementX*0.005;
  rotX -= e.movementY*0.005;
  rotX=Math.max(-1,Math.min(1,rotX));
 }
});

// =======================
// ATAQUE + HITBOX
// =======================
function attack(attacker, target){
 let dist = attacker.position.distanceTo(target.position);

 if(dist < 1.8){
  target.userData.hit = true;
 }
}

document.addEventListener("click",()=>{
 player.userData.attacking = true;
 player.userData.attackTimer = 10;

 attack(player, enemy);
});

// =======================
// IA INIMIGO
// =======================
function enemyAI(){
 let dist = player.position.x - enemy.position.x;

 enemy.position.x += dist * 0.02;

 if(Math.abs(dist)<1.5 && Math.random()<0.02){
  attack(enemy, player);
 }
}

// =======================
// LOOP
// =======================
function animate(){
 requestAnimationFrame(animate);

 // MOVIMENTO PLAYER
 let speed=0.05;

 if(keys["w"]) player.position.z -= speed;
 if(keys["s"]) player.position.z += speed;
 if(keys["a"]) player.position.x -= speed;
 if(keys["d"]) player.position.x += speed;

 // ANIMAÇÃO SIMPLES (idle/attack)
 if(player.userData.attackTimer>0){
  player.rotation.z = Math.sin(player.userData.attackTimer)*0.5;
  player.userData.attackTimer--;
 }else{
  player.rotation.z = 0;
 }

 // INIMIGO
 enemyAI();

 // CÂMERA 3ª PESSOA
 let camOffset = new THREE.Vector3(
  Math.sin(rotY)*5,
  2 + rotX*2,
  Math.cos(rotY)*5
 );

 camera.position.copy(player.position).add(camOffset);
 camera.lookAt(player.position);

 renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
