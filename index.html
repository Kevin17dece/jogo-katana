<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fight Lite</title>

<style>
body{
margin:0;
overflow:hidden;
background:#000;
font-family:Arial;
}

canvas{display:block;}

#ui{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:center;
gap:10px;
}

button{
width:90px;
height:55px;
background:#111;
color:white;
border:1px solid #444;
border-radius:10px;
}
</style>
</head>

<body>

<div id="ui">
<button onclick="attack()">ATTACK</button>
<button onclick="kick()">KICK</button>
<button onclick="block()">BLOCK</button>
</div>

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

// ===== WORLD =====
let player = {x:100,y:300,hp:100,combo:0,block:false};
let enemy = {x:300,y:300,hp:100,attackCD:0};

// ===== DRAW CAVE =====
function drawCave(){
ctx.fillStyle="#050505";
ctx.fillRect(0,0,c.width,c.height);

// chão
ctx.fillStyle="#111";
ctx.fillRect(0,350,c.width,200);

// fundo caverna
ctx.fillStyle="#0a0a0a";
ctx.beginPath();
ctx.arc(200,150,200,0,Math.PI*2);
ctx.fill();
}

// ===== DRAW FIGHTERS =====
function drawFighter(x,y,color){
ctx.fillStyle=color;

// corpo
ctx.fillRect(x,y,30,60);

// cabeça
ctx.fillRect(x+5,y-20,20,20);
}

// ===== COMBAT =====
function attack(){
player.combo++;
if(player.combo>3) player.combo=1;

if(Math.abs(player.x-enemy.x)<60){
enemy.hp -= 5*player.combo;
enemy.x += 10;
}
}

function kick(){
if(Math.abs(player.x-enemy.x)<70){
enemy.hp -= 12;
enemy.x += 20;
}
}

function block(){
player.block = true;
setTimeout(()=>player.block=false,300);
}

// ===== IA =====
function enemyAI(){
if(enemy.attackCD>0){
enemy.attackCD--;
return;
}

if(Math.abs(player.x-enemy.x)>60){
enemy.x -= 1;
}else{
if(Math.random()<0.02){
enemyAttack();
enemy.attackCD=60;
}
}
}

function enemyAttack(){
if(player.block){
player.hp -= 1;
}else{
player.hp -= 8;
player.x -= 15;
}
}

// ===== LOOP =====
function loop(){
requestAnimationFrame(loop);

drawCave();

enemyAI();

// câmera simples (follow)
ctx.save();
ctx.translate(-(player.x-150),0);

// draw
drawFighter(player.x,player.y,"#000");
drawFighter(enemy.x,enemy.y,"#000");

ctx.restore();

// HUD simples
ctx.fillStyle="white";
ctx.fillText("HP: "+player.hp,20,20);
ctx.fillText("ENEMY HP: "+enemy.hp,20,40);

}

loop();
</script>

</body>
</html>
